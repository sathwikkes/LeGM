# Railway service config for the API (root Dockerfile). Set these variables on the service:
#   LEGM_DATABASE_URL = postgresql+psycopg://${{Postgres.PGUSER}}:${{Postgres.PGPASSWORD}}@${{Postgres.PGHOST}}:${{Postgres.PGPORT}}/${{Postgres.PGDATABASE}}
#   LEGM_SECRET_KEY, LEGM_INVITE_CODE, LEGM_CORS_ORIGINS=https://<your-vercel-domain>
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
