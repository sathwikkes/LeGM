[project]
name = "legm"
version = "0.1.0"
description = "LeGM - fantasy NBA draft assistant (Yahoo H2H points)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "nba_api>=1.7",
    "pyyaml>=6.0",
    "rich>=13.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "anthropic>=0.40",
    "email-validator>=2.0",
    "psycopg[binary]>=3.1",
]

[project.scripts]
legm = "legm.cli.main:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["legm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
